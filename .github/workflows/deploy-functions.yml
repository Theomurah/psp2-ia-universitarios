name: Deploy Edge Functions

# Deploy automático das Edge Functions sempre que houver push em main
# afetando arquivos em supabase/functions/.
#
# Secrets necessárias no GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — token da conta Supabase (gerar em https://supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   — ID do projeto (parte do meio do URL: https://XXXXX.supabase.co)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:   # permite disparar manualmente em Actions → Run workflow

jobs:
  # Gate de segurança: roda lint+typecheck+test+build antes do deploy.
  # Sem isso, deploy podia subir Edge Function quebrada se o CI estivesse
  # lento ou se o push fosse direto em main bypassando PR.
  # Origem: auditoria 2026-05-26 (Agente 5 — Testes, F-10).
  validate:
    name: Validate before deploy (lint/typecheck/test/build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy Edge Functions to Supabase
    runs-on: ubuntu-latest
    needs: validate   # bloqueia deploy se validate falhar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      # Todas as functions são deployadas COM verify-jwt habilitado.
      # process-document aceita Bearer service_role (chamada interna do ingest-document)
      # OU JWT do usuário dono do job — validação manual em authorizeProcessDocument().
      - name: Deploy ingest-document
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy ingest-document --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy process-document
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy process-document --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy connect-drive
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy connect-drive --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy generate-system-prompt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy generate-system-prompt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
